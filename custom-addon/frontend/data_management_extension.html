    <!-- cpa-data-management-extension -->
    <style>
      .cpa-data-section { margin-top: auto; padding-top: 10px; }

      #cpa-data-management-page { flex: 1; min-width: 0; padding: 40px; overflow: auto; color: var(--text-primary, #1f2937); }
      .cpa-data-page-title { margin: 0 0 8px; font-size: 28px; font-weight: 800; }
      .cpa-data-page-desc { margin: 0 0 24px; color: var(--text-secondary, #6b7280); }
      .cpa-data-card { background: var(--bg-primary, #fff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 16px; padding: 20px; box-shadow: 0 12px 30px rgba(15, 23, 42, .06); }
      .cpa-data-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }

      .cpa-data-btn-danger { background: var(--error-color, #dc2626); }
      .cpa-data-key { border: 1px solid var(--border-color, #d1d5db); border-radius: 999px; padding: 10px 14px; min-width: 220px; background: var(--bg-primary, #fff); color: var(--text-primary, #111827); }
      .cpa-data-search { border: 1px solid var(--border-color, #d1d5db); border-radius: 999px; padding: 10px 14px; min-width: 220px; background: var(--bg-primary, #fff); color: var(--text-primary, #111827); }
      .cpa-data-btn:disabled { opacity: .55; cursor: not-allowed; }
      .cpa-data-meta { margin-left: auto; color: var(--text-secondary, #6b7280); font-size: 13px; }
      .cpa-data-message { min-height: 20px; margin: 10px 0 14px; color: var(--text-secondary, #6b7280); }
      .cpa-data-message.error { color: var(--error-color, #c2410c); }
      .cpa-data-table-wrap { overflow: auto; border: 1px solid var(--border-color, #e5e7eb); border-radius: 12px; }
      .cpa-data-table { width: 100%; border-collapse: collapse; min-width: 760px; }
      .cpa-data-table th, .cpa-data-table td { border-bottom: 1px solid var(--border-color, #e5e7eb); padding: 10px 12px; text-align: left; vertical-align: top; font-size: 13px; }
      .cpa-data-table th { color: var(--text-secondary, #6b7280); background: var(--bg-secondary, #f8fafc); font-weight: 800; }
      .cpa-data-json, .cpa-data-cell-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .cpa-data-json { max-width: 520px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
      .cpa-data-cell { display: flex; align-items: flex-start; gap: 8px; min-width: 160px; max-width: 520px; }
      .cpa-data-cell-text { flex: 1 1 auto; min-width: 0; margin: 0; overflow: hidden; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .cpa-data-copy { flex: 0 0 auto; border: 1px solid var(--border-color, #d1d5db); border-radius: 999px; padding: 3px 8px; background: var(--bg-primary, #fff); color: var(--text-secondary, #6b7280); font-size: 12px; font-weight: 700; cursor: pointer; }
      .cpa-data-copy:hover { color: var(--text-primary, #111827); border-color: var(--text-secondary, #6b7280); }
      .cpa-data-row-select, .cpa-data-select-all { width: 16px; height: 16px; cursor: pointer; }
      .cpa-data-select-all-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
      .cpa-data-page-btn { border: 1px solid var(--border-color, #d1d5db); border-radius: 999px; padding: 6px 14px; background: var(--bg-primary, #fff); color: var(--text-primary, #111827); font-size: 13px; font-weight: 700; cursor: pointer; }
      .cpa-data-page-btn:disabled { opacity: .4; cursor: not-allowed; }
      .cpa-data-page-btn:not(:disabled):hover { background: var(--bg-secondary, #f8fafc); }
      .cpa-data-page-info { padding: 0 8px; color: var(--text-secondary, #6b7280); font-size: 13px; font-weight: 700; }
      .cpa-data-pagination { display: inline-flex; align-items: center; gap: 4px; }
      .cpa-data-row-delete { color: var(--error-color, #dc2626); }
      .cpa-data-pill { display: inline-flex; align-items: center; border: 1px solid var(--border-color, #e5e7eb); border-radius: 999px; padding: 2px 8px; background: var(--bg-secondary, #f8fafc); color: var(--text-secondary, #6b7280); font-size: 12px; font-weight: 700; }
      .cpa-data-muted { color: var(--text-tertiary, #9ca3af); }
      .cpa-data-detail summary { cursor: pointer; color: var(--text-secondary, #6b7280); font-weight: 700; }
      .cpa-data-empty { padding: 32px; text-align: center; color: var(--text-tertiary, #9ca3af); }
      .cpa-quota-result { border: 0; border-radius: 16px; padding: 20px 24px; min-width: min(420px, 90vw); max-width: 520px; color: var(--text-primary, #111827); background: var(--bg-primary, #fff); }
      .cpa-quota-result::backdrop { background: rgba(15, 23, 42, .4); }
      .cpa-quota-result h2 { margin: 0 0 8px; font-size: 18px; }
      .cpa-quota-result p { margin: 0 0 12px; color: var(--text-secondary, #6b7280); }
      .cpa-quota-result-list { max-height: 240px; overflow: auto; margin: 8px 0 0; padding-left: 18px; }
      .cpa-quota-result-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
      .cpa-quota-card-delete { position: absolute; top: 10px; right: 10px; z-index: 2; border: 0; border-radius: 999px; padding: 4px 10px; background: var(--error-color, #dc2626); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
      [class*="QuotaCard-module__card___"] { position: relative; }
      .cpa-data-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
      .cpa-data-stat { flex: 1 1 120px; border: 1px solid var(--border-color, #e5e7eb); border-radius: 12px; padding: 10px 14px; background: var(--bg-secondary, #f8fafc); color: var(--text-primary, #111827); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
      .cpa-data-stat.cpa-stat-active { border-color: var(--primary-color, #111827); box-shadow: 0 0 0 2px rgba(17, 24, 39, .08); }
      .cpa-data-stat-num { font-size: 22px; font-weight: 800; }
      .cpa-data-stat-label { color: var(--text-secondary, #6b7280); font-size: 12px; font-weight: 700; }
      .cpa-data-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .cpa-data-filter { border: 1px solid var(--border-color, #d1d5db); border-radius: 999px; padding: 6px 12px; background: var(--bg-primary, #fff); color: var(--text-primary, #111827); font-size: 13px; }
      .cpa-data-detect-progress { flex-basis: 100%; color: var(--text-secondary, #6b7280); font-size: 13px; font-weight: 700; }
      .cpa-data-lifecycle-ok { color: #16a34a; font-weight: 700; }
      .cpa-data-lifecycle-bad { color: var(--error-color, #dc2626); font-weight: 700; }
      #cpa-data-batch-page { flex: 1; min-width: 0; padding: 40px; overflow: auto; color: var(--text-primary, #1f2937); }
      .cpa-data-batch-input { border: 1px solid var(--border-color, #d1d5db); border-radius: 8px; padding: 6px 8px; background: var(--bg-primary, #fff); color: var(--text-primary, #111827); width: 100%; min-width: 140px; font-size: 12px; }
      .cpa-data-batch-save { border: 0; border-radius: 999px; padding: 4px 10px; background: var(--primary-color, #111827); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
      @media (max-width: 768px) { #cpa-data-management-page { padding: 24px 16px; } .cpa-data-meta { width: 100%; margin-left: 0; } }
    </style>
    <script>
      (function () {
        var PAGE_ID = 'cpa-data-management-page';
        var NAV_ID = 'cpa-data-management-nav';
        var BATCH_PAGE_ID = 'cpa-data-batch-page';
        var BATCH_NAV_ID = 'cpa-data-batch-nav';
        var WHAM_USAGE_URL = 'https://chatgpt.com/backend-api/wham/usage';
        var DETECT_INTERVAL_MS = 3000;
        var DETECT_RATE_LIMIT_PAUSE_MS = 60000;
        var LIFECYCLE_LABELS = { unused: '未用', in_use: '使用中', sold: '已售出', archived: '归档' };
        var HEALTH_LABELS = { ok: '正常', unknown: '未测', depleted: '已耗尽', token_expired: 'Token过期', token_invalidated: 'Token吊销', token_invalid: 'Token无效', workspace_deactivated: '工作台停用', err: '错误' };
        var active = false;
        var batchActive = false;
        var records = [];
        var total = 0;
        var message = '';
        var error = '';
        var loading = false;
        var selectedRecordIDs = Object.create(null);
        var pageSize = 50;
        var currentPage = 1;
        var searchQuery = '';
        var manualManagementKey = readManualManagementKey();
        var filterLifecycle = '';
        var filterHealth = '';
        var filterAuthState = '';
        var filterBatch = '';
        var statsCache = null;
        var batchLedger = [];
        var batchLedgerTotal = 0;
        var batchMessage = '';
        var batchError = '';
        var batchLoading = false;
        var detectState = { running: false, abort: false, done: 0, total: 0, ok: 0, failed: 0, skipped: 0, note: '' };

        function storageValues(storage) {
          var out = [];
          if (!storage) return out;
          for (var i = 0; i < storage.length; i++) {
            var key = storage.key(i);
            if (!key) continue;
            try { out.push([key, storage.getItem(key)]); } catch (_) {}
          }
          return out;
        }

        function readManualManagementKey() {
          try { return window.sessionStorage.getItem('cpa-data-management-key') || ''; } catch (_) { return ''; }
        }

        function setManualManagementKey(value) {
          manualManagementKey = String(value || '').trim();
          try {
            if (manualManagementKey) window.sessionStorage.setItem('cpa-data-management-key', manualManagementKey);
            else window.sessionStorage.removeItem('cpa-data-management-key');
          } catch (_) {}
        }

        function findManagementKey() {
          if (manualManagementKey && manualManagementKey.trim()) return manualManagementKey.trim();
          var stores = [window.localStorage, window.sessionStorage];
          for (var s = 0; s < stores.length; s++) {
            var values = storageValues(stores[s]);
            for (var i = 0; i < values.length; i++) {
              var raw = values[i][1];
              if (!raw) continue;
              try {
                var parsed = JSON.parse(raw);
                var candidates = [parsed && parsed.managementKey, parsed && parsed.state && parsed.state.managementKey, parsed && parsed.state && parsed.state.auth && parsed.state.auth.managementKey];
                for (var c = 0; c < candidates.length; c++) {
                  if (typeof candidates[c] === 'string' && candidates[c].trim()) return candidates[c].trim();
                }
              } catch (_) {
                if (/management|key|token/i.test(values[i][0]) && raw.length < 512) return raw;
              }
            }
          }
          var input = document.querySelector('input[name="cpa-management-key"]');
          return input && input.value ? input.value.trim() : '';
        }

        function authHeaders(json) {
          var headers = json ? { 'Content-Type': 'application/json' } : {};
          var key = findManagementKey();
          if (key) headers.Authorization = 'Bearer ' + key;
          return headers;
        }

        async function apiFetch(url, options) {
          var key = findManagementKey();
          if (!key) throw new Error('缺少管理密钥，请输入管理密钥后重试');
          options = options || {};
          options.headers = Object.assign({}, options.headers || {}, authHeaders(false));
          var resp = await fetch(url, options);
          var text = await resp.text();
          var data = text ? JSON.parse(text) : {};
          if (!resp.ok) throw new Error(data.error || data.message || ('请求失败：' + resp.status));
          return data;
        }

        function ensureNav() {
          var aside = document.querySelector('aside.sidebar');
          if (!aside || document.getElementById(NAV_ID)) return;
          var section = document.createElement('div');
          section.className = 'nav-section cpa-data-section';
          section.innerHTML = '<div class="nav-section-title">数据</div>'
            + '<button id="' + NAV_ID + '" type="button" class="nav-item cpa-data-nav" aria-label="数据管理"><span class="nav-icon">▦</span><span>数据管理</span></button>'
            + '<button id="' + BATCH_NAV_ID + '" type="button" class="nav-item cpa-data-nav" aria-label="批次账本"><span class="nav-icon">▤</span><span>批次账本</span></button>';
          aside.appendChild(section);
          section.querySelector('#' + NAV_ID).addEventListener('click', function () { showDataPage(); });
          section.querySelector('#' + BATCH_NAV_ID).addEventListener('click', function () { showBatchPage(); });
        }

        function ensurePage() {
          var body = document.querySelector('.main-body') || document.body;
          var page = document.getElementById(PAGE_ID);
          if (page) return page;
          page = document.createElement('main');
          page.id = PAGE_ID;
          page.style.display = 'none';
          body.appendChild(page);
          return page;
        }

        function setMainHidden(hidden) {
          var body = document.querySelector('.main-body') || document.body;
          Array.prototype.forEach.call(body.children, function (child) {
            if (child.matches && child.matches('aside.sidebar')) return;
            if (child.id === PAGE_ID || child.id === BATCH_PAGE_ID) return;
            if (hidden) {
              if (child.dataset.cpaOldDisplay === undefined) child.dataset.cpaOldDisplay = child.style.display || '';
              child.style.display = 'none';
            } else if (child.dataset.cpaOldDisplay !== undefined) {
              child.style.display = child.dataset.cpaOldDisplay;
              delete child.dataset.cpaOldDisplay;
            }
          });
        }

        function render() {
          var page = ensurePage();
          var totalPages = Math.max(1, Math.ceil(total / pageSize));
          var paginationHTML = totalPages > 1
            ? '<span class="cpa-data-pagination">' +
              '<button id="cpa-data-prev" class="cpa-data-page-btn" type="button"' + (currentPage <= 1 ? ' disabled' : '') + '>上一页</button>' +
              '<span class="cpa-data-page-info">' + currentPage + ' / ' + totalPages + '</span>' +
              '<button id="cpa-data-next" class="cpa-data-page-btn" type="button"' + (currentPage >= totalPages ? ' disabled' : '') + '>下一页</button>' +
              '</span>'
            : '';
          page.innerHTML = '<div class="cpa-data-page"><h1 class="cpa-data-page-title">数据管理</h1><p class="cpa-data-page-desc">导入 JSONL 文件后会同步写入本地 SQLite 数据库，并在下方列表查看。</p>'
            + '<div class="cpa-data-stats" id="cpa-data-stats">' + statsCardsHTML() + '</div>'
            + '<div class="cpa-data-card"><div class="cpa-data-toolbar"><input id="cpa-data-management-key" class="cpa-data-key" type="password" placeholder="请输入管理密钥" autocomplete="current-password" value="' + escapeHTML(manualManagementKey) + '" /><input id="cpa-data-file" class="cpa-data-file" type="file" accept=".jsonl,application/jsonl,text/plain" /><button id="cpa-data-import" class="cpa-data-btn" type="button">导入 JSONL</button><button id="cpa-data-export" class="cpa-data-btn" type="button">导出 JSONL</button><button id="cpa-data-refresh" class="cpa-data-btn" type="button">刷新列表</button><input id="cpa-data-search" class="cpa-data-search" type="search" placeholder="搜索 email、status 或 nextTime" value="' + escapeHTML(searchQuery) + '" /><button id="cpa-data-search-btn" class="cpa-data-btn" type="button">搜索</button>' + paginationHTML + '<button id="cpa-data-delete-selected" class="cpa-data-btn cpa-data-btn-danger" type="button">删除选中</button><button id="cpa-data-delete-all" class="cpa-data-btn cpa-data-btn-danger" type="button">全部删除</button><button id="cpa-data-generate-quota" class="cpa-data-btn" type="button">生成配额</button><span class="cpa-data-meta">共 ' + total + ' 条，已选 ' + selectedDataRecordIDs().length + ' 条</span></div>'
            + '<div class="cpa-data-filters">'
            + '<select id="cpa-data-filter-lifecycle" class="cpa-data-filter" title="业务状态筛选"><option value="">全部业务状态</option>' + selectOptions(LIFECYCLE_LABELS, filterLifecycle) + '</select>'
            + '<select id="cpa-data-filter-health" class="cpa-data-filter" title="健康状态筛选"><option value="">全部健康状态</option>' + selectOptions(HEALTH_LABELS, filterHealth) + '</select>'
            + '<select id="cpa-data-filter-auth" class="cpa-data-filter" title="授权状态筛选"><option value="">全部授权状态</option><option value="authorized"' + (filterAuthState === 'authorized' ? ' selected' : '') + '>已授权</option><option value="missing_mailapi_url"' + (filterAuthState === 'missing_mailapi_url' ? ' selected' : '') + '>缺 mailapi_url</option></select>'
            + '<select id="cpa-data-filter-batch" class="cpa-data-filter" title="批次筛选"><option value="">全部批次</option>' + batchLedger.map(function (b) { return '<option value="' + escapeHTML(b.batch_key) + '"' + (filterBatch === b.batch_key ? ' selected' : '') + '>' + escapeHTML(shortBatchLabel(b.batch_key)) + '（' + (b.record_count || 0) + '）</option>'; }).join('') + '</select>'
            + '<button id="cpa-data-filter-clear" class="cpa-data-btn" type="button">清除筛选</button>'
            + '<select id="cpa-data-lifecycle-value" class="cpa-data-filter" title="批量设置业务状态"><option value="unused">标记为：未用</option><option value="in_use">标记为：使用中</option><option value="sold">标记为：已售出</option><option value="archived">标记为：归档</option></select>'
            + '<button id="cpa-data-apply-lifecycle" class="cpa-data-btn" type="button">应用业务状态</button>'
            + '</div>'
            + '<div class="cpa-data-toolbar"><button id="cpa-data-detect-selected" class="cpa-data-btn" type="button">检测选中</button><button id="cpa-data-detect-filtered" class="cpa-data-btn" type="button">检测当前筛选</button><button id="cpa-data-detect-stop" class="cpa-data-btn cpa-data-btn-danger" type="button" disabled>停止检测</button><span class="cpa-data-detect-progress" id="cpa-data-detect-progress">' + escapeHTML(detectProgressText()) + '</span></div>'
            + '<div class="cpa-data-message ' + (error ? 'error' : '') + '">' + escapeHTML(error || message || (loading ? '加载中...' : '')) + '</div><div class="cpa-data-table-wrap">' + tableHTML() + '</div></div></div>';
          page.querySelector('#cpa-data-import').disabled = loading;
          page.querySelector('#cpa-data-export').disabled = loading || selectedDataRecordIDs().length === 0;
          page.querySelector('#cpa-data-refresh').disabled = loading;
          page.querySelector('#cpa-data-delete-selected').disabled = loading || selectedDataRecordIDs().length === 0;
          page.querySelector('#cpa-data-delete-all').disabled = loading || total === 0;
          page.querySelector('#cpa-data-generate-quota').disabled = loading || selectedDataRecordIDs().length === 0;
          page.querySelector('#cpa-data-search-btn').disabled = loading;
          page.querySelector('#cpa-data-management-key').addEventListener('input', function (event) { setManualManagementKey(event.target.value); });
          page.querySelector('#cpa-data-search').addEventListener('keydown', function (event) { if (event.key === 'Enter') searchDataRecords(); });
          page.querySelector('#cpa-data-import').addEventListener('click', importFile);
          page.querySelector('#cpa-data-export').addEventListener('click', exportJSONL);
          page.querySelector('#cpa-data-refresh').addEventListener('click', function () { currentPage = 1; loadRecords(); });
          page.querySelector('#cpa-data-search-btn').addEventListener('click', searchDataRecords);
          var prevBtn = page.querySelector('#cpa-data-prev');
          var nextBtn = page.querySelector('#cpa-data-next');
          if (prevBtn) prevBtn.addEventListener('click', function () { goToPage(-1); });
          if (nextBtn) nextBtn.addEventListener('click', function () { goToPage(1); });
          page.querySelector('#cpa-data-delete-selected').addEventListener('click', function () { deleteSelectedRecords(); });
          page.querySelector('#cpa-data-delete-all').addEventListener('click', function () { deleteAllRecords(); });
          page.querySelector('#cpa-data-generate-quota').addEventListener('click', function () { generateQuotaFiles(); });
          page.querySelector('#cpa-data-filter-lifecycle').addEventListener('change', function (event) { filterLifecycle = event.target.value; currentPage = 1; loadRecords(); });
          page.querySelector('#cpa-data-filter-health').addEventListener('change', function (event) { filterHealth = event.target.value; currentPage = 1; loadRecords(); });
          page.querySelector('#cpa-data-filter-auth').addEventListener('change', function (event) { filterAuthState = event.target.value; currentPage = 1; loadRecords(); });
          page.querySelector('#cpa-data-filter-batch').addEventListener('change', function (event) { filterBatch = event.target.value; currentPage = 1; loadRecords(); });
          page.querySelector('#cpa-data-filter-clear').addEventListener('click', function () { clearDataFilters(); });
          page.querySelector('#cpa-data-apply-lifecycle').addEventListener('click', function () { applyLifecycleToSelected(); });
          page.querySelector('#cpa-data-detect-selected').addEventListener('click', function () { startDetection(false); });
          page.querySelector('#cpa-data-detect-filtered').addEventListener('click', function () { startDetection(true); });
          page.querySelector('#cpa-data-detect-stop').addEventListener('click', function () { detectState.abort = true; updateDetectProgress('正在停止...'); });
          Array.prototype.forEach.call(page.querySelectorAll('.cpa-data-stat'), function (card) {
            card.addEventListener('click', function () { applyStatCardFilter(card.getAttribute('data-filter') || ''); });
          });
          page.querySelector('.cpa-data-table-wrap').addEventListener('click', function (event) {
            var deleteButton = event.target && event.target.closest ? event.target.closest('.cpa-data-row-delete') : null;
            if (deleteButton) {
              selectedRecordIDs = Object.create(null);
              selectedRecordIDs[String(deleteButton.getAttribute('data-id') || '')] = true;
              deleteSelectedRecords();
            }
          });
          page.querySelector('.cpa-data-table-wrap').addEventListener('change', function (event) {
            var selectAll = event.target && event.target.closest ? event.target.closest('.cpa-data-select-all') : null;
            if (selectAll) { toggleAllDataRecords(selectAll.checked); return; }
            var checkbox = event.target && event.target.closest ? event.target.closest('.cpa-data-row-select') : null;
            if (!checkbox) return;
            if (checkbox.checked) selectedRecordIDs[String(checkbox.value)] = true;
            else delete selectedRecordIDs[String(checkbox.value)];
            render();
          });
          syncSelectAllCheckbox();
        }


        function tableHTML() {
          if (!records.length) return '<div class="cpa-data-empty">暂无数据</div>';
          var columns = dataColumns(records);
          var hasQuota = columns.indexOf('quota') !== -1;
          var hasStatus = columns.indexOf('status') !== -1;
          var hasNextTime = columns.indexOf('nextTime') !== -1;
          var normalColumns = columns.filter(function (key) { return key !== 'quota' && key !== 'status' && key !== 'nextTime'; });
          var header = '<tr><th><label class="cpa-data-select-all-label"><input class="cpa-data-select-all" type="checkbox" aria-label="全选当前列表" title="全选当前列表" />选择</label></th><th>ID</th>' + (hasQuota ? '<th>额度</th>' : '') + (hasStatus ? '<th>status</th>' : '') + (hasNextTime ? '<th>nextTime</th>' : '') + normalColumns.map(function (key) { return '<th>' + escapeHTML(key) + '</th>'; }).join('') + '<th>操作</th></tr>';
          var rows = records.map(function (r) {
            var id = String(r.id);
            var data = (r.data && typeof r.data === 'object' && !Array.isArray(r.data)) ? r.data : { value: r.data };
            return '<tr>'
              + '<td><input class="cpa-data-row-select" type="checkbox" value="' + escapeHTML(id) + '"' + (selectedRecordIDs[id] ? ' checked' : '') + ' /></td>'
              + '<td>' + cellHTML(r.id) + '</td>'
              + (hasQuota ? '<td>' + cellHTML(data.quota, 'quota') + '</td>' : '')
              + (hasStatus ? '<td>' + cellHTML(data.status, 'status') + '</td>' : '')
              + (hasNextTime ? '<td>' + cellHTML(data.nextTime, 'nextTime') + '</td>' : '')
              + normalColumns.map(function (key) { return '<td>' + cellHTML(data[key], key) + '</td>'; }).join('')
              + '<td><button class="cpa-data-copy cpa-data-row-delete" type="button" data-id="' + escapeHTML(id) + '">删除</button></td>'
              + '</tr>';
          }).join('');
          var minWidth = Math.max(860, 260 + columns.length * 190);
          return '<table class="cpa-data-table" style="min-width:' + minWidth + 'px"><thead>' + header + '</thead><tbody>' + rows + '</tbody></table>';
        }

        function cellHTML(value, key) {
          var text = formatCellValue(value, key);
          return '<div class="cpa-data-cell"><pre class="cpa-data-cell-text">' + escapeHTML(text) + '</pre></div>';
        }

        function dataColumns(items) {
          var seen = Object.create(null);
          var columns = [];
          items.forEach(function (record) {
            var data = record && record.data;
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
              if (!seen.value) { seen.value = true; columns.push('value'); }
              return;
            }
            Object.keys(data).forEach(function (key) {
              if (!seen[key]) { seen[key] = true; columns.push(key); }
            });
          });
          return prioritizeNextTimeColumn(columns);
        }

        function prioritizeNextTimeColumn(columns) {
          var priority = [];
          if (columns.indexOf('quota') !== -1) priority.push('quota');
          if (columns.indexOf('status') !== -1) priority.push('status');
          if (columns.indexOf('nextTime') !== -1) priority.push('nextTime');
          if (!priority.length) return columns;
          return priority.concat(columns.filter(function (key) { return key !== 'quota' && key !== 'status' && key !== 'nextTime'; }));
        }

        function formatCellValue(value, key) {
          if (value === undefined || value === null) return '';
          if (key === 'quota') return formatQuotaValue(value);
          if (key === 'nextTime') return formatNextTimeValue(value);
          if (typeof value === 'object') return JSON.stringify(value, null, 2);
          return String(value);
        }

        function formatQuotaValue(value) {
          var text = String(value).trim();
          if (!text) return '';
          if (/%$/.test(text)) return text;
          var number = Number(text);
          return Number.isFinite(number) ? String(number) + '%' : text;
        }

        function formatNextTimeValue(value) {
          var text = String(value).trim();
          if (!text) return '';
          if (/^\d{1,2}-\d{1,2}$/.test(text)) return text + ' 00:00';
          if (/^\d{1,2}-\d{1,2}\s+\d{1,2}:\d{1,2}$/.test(text)) {
            return text.replace(/(\d{1,2}):(\d{1,2})$/, function (_, hour, minute) { return pad2(hour) + ':' + pad2(minute); });
          }
          return text;
        }

        function pad2(value) {
          value = String(value);
          return value.length === 1 ? '0' + value : value;
        }

        function accountSummary(record) {
          var data = record.data || {};
          var summary = record.summary || {};
          var mailboxEnabled = summary.mailbox_enabled;
          var mailboxProvider = summary.mailbox_provider || (data.mailbox && data.mailbox.provider) || '-';
          return {
            platform: summary.platform || data.platform || '-',
            email: summary.email || data.email || summary.login_identity || data.login_identity || '-',
            status: summary.status || data.status || '-',
            orgProject: compactJoin([summary.organization_id || data.organization_id, summary.project_id || data.project_id], ' / ') || '-',
            usedAt: formatUnixTime(summary.last_used || data.last_used || summary.created_at || data.created_at),
            mailbox: mailboxProvider + ' · ' + (mailboxEnabled === true ? '启用' : '未启用')
          };
        }

        function compactJoin(values, sep) {
          return values.filter(function (v) { return v !== undefined && v !== null && String(v).trim() !== ''; }).join(sep);
        }

        function formatUnixTime(value) {
          if (value === undefined || value === null || value === '') return '-';
          var number = Number(value);
          if (!Number.isFinite(number)) return String(value);
          if (number > 100000000000) number = Math.floor(number / 1000);
          var date = new Date(number * 1000);
          if (Number.isNaN(date.getTime())) return String(value);
          return date.toLocaleString();
        }

        function escapeHTML(value) {
          return String(value == null ? '' : value).replace(/[&<>"]/g, function (ch) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]; });
        }

        function recordEmail(data) {
          if (!data || typeof data !== 'object') return '';
          var candidates = [data.email, data.account_claims_email, data.login_identity, data.account_email];
          for (var i = 0; i < candidates.length; i++) {

        function detectProgressText() {
          if (!detectState.running && !detectState.done) return '未在检测中';
          return '检测进度 ' + detectState.done + '/' + detectState.total + '，正常 ' + detectState.ok + '，失败 ' + detectState.failed + '，跳过 ' + detectState.skipped + (detectState.note ? '，' + detectState.note : '');
        }

        function updateDetectProgress(text) {
          var el = document.getElementById('cpa-data-detect-progress');
          if (el) el.textContent = text || detectProgressText();
          var stop = document.getElementById('cpa-data-detect-stop');

        function sleep(ms) {

        async function collectFilteredRecords() {
          var collected = [];
          var offset = 0;
          var pageLimit = 200;
          while (true) {
            var data = await apiFetch('/v0/management/data-records?limit=' + pageLimit + '&offset=' + offset + filterQueryString());
            var rows = data.records || [];
            collected = collected.concat(rows);
            if (rows.length < pageLimit || collected.length >= (data.total || 0) || collected.length >= 5000) break;
            offset += pageLimit;
          }
          return collected;
        }

        async function startDetection(filteredOnly) {
          if (detectState.running) return;
          var pool;
          try {
            if (filteredOnly) {
              pool = await collectFilteredRecords();
            } else {
              var selected = selectedDataRecordIDs();
              pool = records.filter(function (record) { return selected.indexOf(record.id) !== -1; });
            }
          } catch (e) { error = e.message || String(e); render(); return; }
          var targets = pool.filter(function (record) {
            var data = record.data;
            return recordEmail(data) && recordToken(data);
          }).map(function (record) {
            return { email: recordEmail(record.data), token: recordToken(record.data) };
          });
          if (!targets.length) { error = '没有可检测的记录（需要 email 和 access_token）'; message = ''; render(); return; }
          detectState = { running: true, abort: false, done: 0, total: targets.length, ok: 0, failed: 0, skipped: 0, note: '' };
          error = ''; message = '检测已开始...'; render();
          updateDetectProgress();
          await runDetectionLoop(targets);
        }

        async function runDetectionLoop(targets) {
          for (var i = 0; i < targets.length; i++) {
            if (detectState.abort) { detectState.note = '已手动停止'; break; }
            var target = targets[i];
            detectState.done += 1;
            updateDetectProgress('正在检测 ' + target.email);
            try {
              var resp = await apiFetch('/v0/management/api-call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Cpa-Data-Email': target.email },
                body: JSON.stringify({ method: 'GET', url: WHAM_USAGE_URL, header: { Authorization: 'Bearer ' + target.token } })
              });
              var code = resp && typeof resp.status_code === 'number' ? resp.status_code : 0;
              if (code === 429) {
                detectState.skipped += 1;
                for (var wait = DETECT_RATE_LIMIT_PAUSE_MS / 1000; wait > 0; wait -= 5) {
                  if (detectState.abort) break;
                  updateDetectProgress('触发限流（429），退避 ' + wait + ' 秒后继续...');
                  await sleep(5000);
                }
              } else if (code >= 200 && code < 300) {
                detectState.ok += 1;
              } else {
                detectState.failed += 1;
              }
            } catch (e) {
              detectState.failed += 1;
              detectState.note = (e.message || String(e)).slice(0, 80);
            }
            updateDetectProgress();
            if (i < targets.length - 1) await sleep(DETECT_INTERVAL_MS);
          }
          detectState.running = false;
          message = '检测结束：正常 ' + detectState.ok + '，失败 ' + detectState.failed + '，跳过 ' + detectState.skipped + (detectState.abort ? '（手动停止）' : '');
          render();
          loadRecords();
        }

        function renderBatchPage() {
          var page = ensureBatchPage();
          var rows = batchLedger.map(function (batch) {
            var health = batch.health || {};
            var auth = batch.auth_state || {};
            var healthText = Object.keys(health).map(function (key) { return (HEALTH_LABELS[key] || key) + ' ' + health[key]; }).join('，') || '-';
            var healthBad = (health.token_expired || 0) + (health.token_invalidated || 0) + (health.token_invalid || 0) + (health.workspace_deactivated || 0) + (health.err || 0) + (health.depleted || 0);
            var authText = Object.keys(auth).map(function (key) { return key === 'authorized' ? '已授权 ' + auth[key] : '缺mailapi ' + auth[key]; }).join('，') || '-';
            return '<tr>'
              + '<td>' + escapeHTML(shortBatchLabel(batch.batch_key)) + '<div class="cpa-data-muted" style="font-size:11px">' + escapeHTML(batch.batch_key) + '</div></td>'
              + '<td>' + escapeHTML(batch.batch_date || '-') + '</td>'
              + '<td>' + escapeHTML(batch.order_id || '-') + '</td>'
              + '<td>' + (batch.quantity === null || batch.quantity === undefined ? '-' : escapeHTML(batch.quantity)) + '</td>'
              + '<td>' + (batch.total_cost ? escapeHTML(batch.total_cost) + ' 元' : '-') + '</td>'
              + '<td><strong>' + (batch.record_count || 0) + '</strong></td>'
              + '<td>' + (healthBad ? '<span class="cpa-data-lifecycle-bad">' + healthText + '</span>' : '<span class="cpa-data-lifecycle-ok">' + healthText + '</span>') + '</td>'
              + '<td>' + escapeHTML(authText) + '</td>'
              + '<td><input class="cpa-data-batch-input" id="cpa-batch-url-' + escapeHTML(batch.batch_key) + '" value="' + escapeHTML(batch.order_url || '') + '" placeholder="订单查询链接" /></td>'
              + '<td><input class="cpa-data-batch-input" id="cpa-batch-notes-' + escapeHTML(batch.batch_key) + '" value="' + escapeHTML(batch.notes || '') + '" placeholder="备注（如：已售出）" /></td>'
              + '<td><button class="cpa-data-batch-save" type="button" data-key="' + escapeHTML(batch.batch_key) + '">保存</button> <button class="cpa-data-batch-save" type="button" data-view="' + escapeHTML(batch.batch_key) + '">查看</button></td>'
              + '</tr>';
          }).join('');
          page.innerHTML = '<div class="cpa-data-page"><h1 class="cpa-data-page-title">批次账本</h1><p class="cpa-data-page-desc">按采购批次聚合的账本，替代手工维护的汇总表。点击「查看」跳转到数据管理页并按批次筛选。</p>'
            + '<div class="cpa-data-card"><div class="cpa-data-toolbar"><button id="cpa-batch-refresh" class="cpa-data-btn" type="button">刷新账本</button><span class="cpa-data-meta">共 ' + batchLedgerTotal + ' 个批次</span></div>'
            + '<div class="cpa-data-message ' + (batchError ? 'error' : '') + '">' + escapeHTML(batchError || batchMessage || (batchLoading ? '加载中...' : '')) + '</div>'
            + '<div class="cpa-data-table-wrap">' + (rows ? '<table class="cpa-data-table"><thead><tr><th>批次</th><th>采购日期</th><th>订单号</th><th>件数</th><th>总价</th><th>记录数</th><th>健康分布</th><th>授权分布</th><th>订单链接</th><th>备注</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table>' : '<div class="cpa-data-empty">暂无批次数据</div>') + '</div></div></div>';
          page.querySelector('#cpa-batch-refresh').addEventListener('click', function () { loadBatches().then(renderBatchPage); });
          Array.prototype.forEach.call(page.querySelectorAll('.cpa-data-batch-save[data-key]'), function (button) {
            button.addEventListener('click', function () { saveBatchMeta(button.getAttribute('data-key')); });
          });
          Array.prototype.forEach.call(page.querySelectorAll('.cpa-data-batch-save[data-view]'), function (button) {
            button.addEventListener('click', function () {
              filterBatch = button.getAttribute('data-view') || '';
              currentPage = 1;
              showDataPage();
              loadRecords();
            });
          });
        }

        async function saveBatchMeta(batchKey) {
          var urlInput = document.getElementById('cpa-batch-url-' + batchKey);
          var notesInput = document.getElementById('cpa-batch-notes-' + batchKey);
          batchMessage = ''; batchError = '';
          try {
            await apiFetch('/v0/management/data-records/update-batch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ batch_key: batchKey, order_url: urlInput ? urlInput.value : '', notes: notesInput ? notesInput.value : '' }) });
            batchMessage = '批次已保存';
            await loadBatches();
          } catch (e) { batchError = e.message || String(e); }
          renderBatchPage();
        }

        function ensureBatchPage() {
          var body = document.querySelector('.main-body') || document.body;
          var page = document.getElementById(BATCH_PAGE_ID);
          if (page) return page;
          page = document.createElement('main');
          page.id = BATCH_PAGE_ID;
          page.style.display = 'none';
          body.appendChild(page);
          return page;
        }

        function setDataNavActive(isActive) {
          var nav = document.getElementById(NAV_ID);
          if (!nav) return;
          var batchNav = document.getElementById(BATCH_NAV_ID);
          if (batchNav) {
            batchNav.classList.remove('active');
            batchNav.classList.remove('cpa-active');
            batchNav.removeAttribute('aria-current');
          }
          if (!nav) return;
          if (isActive) {
            Array.prototype.forEach.call(document.querySelectorAll('aside.sidebar .nav-item.active'), function (item) {
              if (item !== nav) item.classList.remove('active');
            });
            nav.classList.add('active');
            nav.classList.add('cpa-active');
            nav.setAttribute('aria-current', 'page');
            return;
          }
          nav.classList.remove('active');
          nav.classList.remove('cpa-active');
          nav.removeAttribute('aria-current');
        }

        function showDataPage() {
          active = true;
          batchActive = false;
          if (location.hash !== '#/data-management') history.pushState(null, '', '#/data-management');
          ensureNav(); ensurePage(); ensureBatchPage(); setMainHidden(true);
          var page = document.getElementById(PAGE_ID);
          if (page) page.style.display = 'block';
          var batchPage = document.getElementById(BATCH_PAGE_ID);
          if (batchPage) batchPage.style.display = 'none';
          setBatchNavActive(false);
          setDataNavActive(true);
          render();
          if (findManagementKey()) { loadRecords(); }
          else { error = '请输入管理密钥后再导入 JSONL'; message = ''; render(); }
        }

        function hideDataPage() {
          active = false;
          setMainHidden(false);
          var page = document.getElementById(PAGE_ID);
          if (page) page.style.display = 'none';
          setDataNavActive(false);
        }

        function setBatchNavActive(isActive) {
          var nav = document.getElementById(BATCH_NAV_ID);
          if (!nav) return;
          if (isActive) {
            Array.prototype.forEach.call(document.querySelectorAll('aside.sidebar .nav-item.active'), function (item) {
              if (item !== nav) item.classList.remove('active');
            });
            nav.classList.add('active');
            nav.classList.add('cpa-active');
            nav.setAttribute('aria-current', 'page');
            return;
          }
          nav.classList.remove('active');
          nav.classList.remove('cpa-active');
          nav.removeAttribute('aria-current');
        }

        function showBatchPage() {
          batchActive = true;
          active = false;
          if (location.hash !== '#/batch-ledger') history.pushState(null, '', '#/batch-ledger');
          ensureNav(); ensurePage(); ensureBatchPage(); setMainHidden(true);
          var batchPage = document.getElementById(BATCH_PAGE_ID);
          if (batchPage) batchPage.style.display = 'block';
          var page = document.getElementById(PAGE_ID);
          if (page) page.style.display = 'none';
          setDataNavActive(false);
          setBatchNavActive(true);
          if (findManagementKey()) { loadBatches().then(function () { renderBatchPage(); }); renderBatchPage(); }
          else { batchError = '请输入管理密钥后再查看批次账本'; renderBatchPage(); }
        }

        function hideBatchPage() {
          batchActive = false;
          setMainHidden(false);
          var batchPage = document.getElementById(BATCH_PAGE_ID);
          if (batchPage) batchPage.style.display = 'none';
          setBatchNavActive(false);
        }

        document.addEventListener('click', function (event) {
          var nav = event.target && event.target.closest ? event.target.closest('aside.sidebar .nav-item') : null;
          if (nav && nav.id !== NAV_ID && nav.id !== BATCH_NAV_ID) { hideDataPage(); hideBatchPage(); }
        }, true);

        window.addEventListener('popstate', function () {
          if (location.hash === '#/data-management') showDataPage();
          else if (location.hash === '#/batch-ledger') showBatchPage();
          else { hideDataPage(); hideBatchPage(); }
        });
        new MutationObserver(function () {
          ensureNav();
          enhanceQuotaCards();
          if (active) { ensurePage(); setMainHidden(true); setDataNavActive(true); }
          if (batchActive) { ensureBatchPage(); setMainHidden(true); setBatchNavActive(true); }
        }).observe(document.documentElement, { childList: true, subtree: true });
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { ensureNav(); enhanceQuotaCards(); }); else { ensureNav(); enhanceQuotaCards(); }
        if (location.hash === '#/data-management') setTimeout(showDataPage, 0);
        else if (location.hash === '#/batch-ledger') setTimeout(showBatchPage, 0);
      })();
    </script>
